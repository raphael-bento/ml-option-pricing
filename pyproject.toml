[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "option-pricing-ml"
version = "0.1.0"
description = "Neural networks that learn the Black-Scholes pricing function, with uncertainty quantification"
authors = [{ name = "Raphaël Bento" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "torch>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
market = ["yfinance>=0.2"]
notebook = ["jupyter>=1.0", "nbformat>=5.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
